name: Pricing

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - pricing.go
      - pricing_feed_test.go
      - pricing_live_test.go
      - antigravity.go
      - claude.go
      - codex.go
      - copilot.go
      - opencode.go
      - .github/workflows/pricing.yml

defaults:
  run:
    shell: bash -euo pipefail {0}

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  feed:
    name: compare with models.dev
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Compare the pricing table with the feed
        run: go test -tags pricecheck -run '^TestPricingMatchesFeed$' -count=1 . 2>&1 | tee pricecheck.log

      - name: Summarize
        if: always()
        run: |
          {
            echo '```'
            cat pricecheck.log
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
